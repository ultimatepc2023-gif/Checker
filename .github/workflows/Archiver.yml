name: Archiver

on:
  workflow_dispatch:

  repository_dispatch:
    types: [Archiver]

permissions:
  actions: write
  contents: read

jobs:
  Archiver:
    runs-on: ubuntu-latest

    steps:
      - name: Check Actions Run
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ secrets.REPO }}
        run: |
          set -e

          echo "=========================================="
          echo "Checking repository: $REPO"
          echo "=========================================="

          RUNNING=$(gh run list \
            --repo "$REPO" \
            --status in_progress \
            --limit 100 \
            --json databaseId \
            --jq 'length')

          QUEUED=$(gh run list \
            --repo "$REPO" \
            --status queued \
            --limit 100 \
            --json databaseId \
            --jq 'length')

          echo "Running Actions : $RUNNING"
          echo "Queued Actions  : $QUEUED"

          if [ "$RUNNING" -eq 0 ] && [ "$QUEUED" -eq 0 ]; then

            echo "No Actions are running or queued."
            echo "Triggering main.yml..."

            gh workflow run main.yml \
              --repo "$REPO" \
              --ref main

            echo "main.yml triggered successfully."

          else

            echo "An Action is running or queued."
            echo "Not triggering main.yml."
            echo "Archiver finished."

          fi
