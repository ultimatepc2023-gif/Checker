name: 2027 MODEL PCD

on:
  repository_dispatch:
    types: [2027MODELPCD]
  workflow_dispatch:

jobs:
  CloudPC:
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Configure Core
        run: |
          $tz = "${{ secrets.RDP_TIMEZONE }}"
          if (-not [string]::IsNullOrWhiteSpace($tz)) {
              Set-TimeZone -Id $tz
          }

          $zoomOrigins = '[{"allowed_origins":["https://zoom.us","https://www.zoom.us","https://us02web.zoom.us","https://us03web.zoom.us","https://us04web.zoom.us","https://us05web.zoom.us","https://us06web.zoom.us","https://us07web.zoom.us","https://us08web.zoom.us","https://us09web.zoom.us","https://us10web.zoom.us","https://us11web.zoom.us","https://us12web.zoom.us","https://us13web.zoom.us","https://us14web.zoom.us","https://us15web.zoom.us","https://us16web.zoom.us","https://us17web.zoom.us","https://us18web.zoom.us","https://us19web.zoom.us","https://us20web.zoom.us"],"protocol":"zoommtg"}]'
          
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Edge' -Name 'AutoLaunchProtocolsFromOrigins' -Type String -Value $zoomOrigins -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          $path = "HKCU:\Control Panel\Accessibility\StickyKeys"
          New-Item -Path $path -Force | Out-Null
          Set-ItemProperty -Path $path -Name "Flags" -Value "58" -Type String
          $path2 = "HKCU:\Control Panel\Accessibility\Keyboard Response"
          New-Item -Path $path2 -Force | Out-Null
          Set-ItemProperty -Path $path2 -Name "Flags" -Value "122" -Type String

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "MaxInstanceCount" -Value 100 -Force

          $rdpTcp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdpTcp -Name "AudioMode" -Value 2 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "fDisableCam"           -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $rdpTcp -Name "fDisableAudioCapture"  -Value 0 -Type DWord -Force

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "fDisableAudio"            -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $policyPath -Name "fDisableAudioCapture"     -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $policyPath -Name "fDisableCam"              -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $policyPath -Name "fDisableAudioRedirection" -Value 0 -Type DWord -Force

          Set-Service -Name "AudioSrv" -StartupType Automatic
          Start-Service -Name "AudioSrv" -ErrorAction SilentlyContinue
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
          Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue

          sc.exe failure AudioSrv             reset= 0 actions= restart/1000/restart/1000/restart/1000 | Out-Null
          sc.exe failure AudioEndpointBuilder reset= 0 actions= restart/1000/restart/1000/restart/1000 | Out-Null

          powercfg /change monitor-timeout-ac 0
          powercfg /change standby-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change monitor-timeout-dc 0
          powercfg /change standby-timeout-dc 0

          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name "LimitBlankPasswordUse" -Value 0 -Type DWord -Force

          Restart-Service -Name TermService -Force

      - name: Create RDP User & Security Policies
        run: |
          $userName = "Cloud PC"
          $password = "123456"

          Write-Host "::add-mask::$password"
          Write-Host "::add-mask::$userName"

          # Delete stale "Cloud PC*" profile folders so Windows creates a
          # clean "C:\Users\Cloud PC" (no .MACHINENAME suffix)
          $staleProfiles = Get-ChildItem -Path "C:\Users" -Directory -ErrorAction SilentlyContinue |
                           Where-Object { $_.Name -like "Cloud PC*" }
          foreach ($p in $staleProfiles) {
              Write-Host "Removing stale profile folder: $($p.FullName)"
              Remove-Item -Path $p.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

          secedit /export /cfg "$env:TEMP\secpol.cfg"
          $cfgContent = Get-Content "$env:TEMP\secpol.cfg"
          $cfgContent = $cfgContent -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
          $cfgContent = $cfgContent -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
          $cfgContent = $cfgContent -replace 'LimitBlankPasswordUse = 1', 'LimitBlankPasswordUse = 0'
          $cfgContent | Out-File -Encoding ascii "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secpol.sdb" /cfg "$env:TEMP\secpol.cfg" /areas SECURITYPOLICY

          $existing = Get-LocalUser -Name $userName -ErrorAction SilentlyContinue
          if ($existing) {
              Remove-LocalUser -Name $userName -ErrorAction SilentlyContinue
          }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop

          net user "$userName" "$password"
          net user "$userName" /active:yes
          net user "$userName" /passwordchg:no
          net user "$userName" /expires:never

          Add-LocalGroupMember -Group "Administrators"       -Member $userName -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName -ErrorAction SilentlyContinue

          $policyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Personalization'
          if (-not (Test-Path $policyPath)) { New-Item -Path $policyPath -Force | Out-Null }
          Set-ItemProperty -Path $policyPath -Name "NoLockScreen" -Value 1 -Type DWord -Force

          $saverPol = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Control Panel\Desktop'
          New-Item -Path $saverPol -Force | Out-Null
          Set-ItemProperty -Path $saverPol -Name "ScreenSaveActive"    -Value "0" -Type String -Force
          Set-ItemProperty -Path $saverPol -Name "ScreenSaveTimeOut"   -Value "0" -Type String -Force
          Set-ItemProperty -Path $saverPol -Name "ScreenSaverIsSecure" -Value "0" -Type String -Force

          $sysPol = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
          if (-not (Test-Path $sysPol)) { New-Item -Path $sysPol -Force | Out-Null }
          Set-ItemProperty -Path $sysPol -Name "InactivityTimeoutSecs"     -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $sysPol -Name "DisableLockWorkstation"    -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $sysPol -Name "EnableFirstLogonAnimation" -Value 0 -Type DWord -Force

          $tsPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services'
          if (-not (Test-Path $tsPath)) { New-Item -Path $tsPath -Force | Out-Null }
          Set-ItemProperty -Path $tsPath -Name "MaxIdleTime"            -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "MaxDisconnectionTime"   -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "RemoteAppLogoffTimeout" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fResetBroken"           -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fDisableAutoReconnect"  -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fNoRemoteControl"       -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fPromptForPassword"     -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $tsPath -Name "fAllowToGetHelp"        -Value 0 -Type DWord -Force

          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty -Path $winlogon -Name "AutoAdminLogon"    -Value "1"               -Force
          Set-ItemProperty -Path $winlogon -Name "DefaultUsername"   -Value $userName         -Force
          Set-ItemProperty -Path $winlogon -Name "DefaultPassword"   -Value $password         -Force
          Set-ItemProperty -Path $winlogon -Name "DefaultDomainName" -Value $env:COMPUTERNAME -Force
          Set-ItemProperty -Path $winlogon -Name "ForceAutoLogon"    -Value "1"               -Force
          Remove-ItemProperty -Path $winlogon -Name "AutoLogonCount" -ErrorAction SilentlyContinue

          $userHive = "C:\Users\$userName\NTUSER.DAT"
          if (Test-Path $userHive) {
              reg load "HKU\TEMPUSER" "$userHive" 2>$null | Out-Null
              $deskPath = "HKU:\TEMPUSER\Control Panel\Desktop"
              if (Test-Path $deskPath) {
                  Set-ItemProperty -Path $deskPath -Name "ScreenSaveActive"    -Value "0" -Force
                  Set-ItemProperty -Path $deskPath -Name "ScreenSaveTimeOut"   -Value "0" -Force
                  Set-ItemProperty -Path $deskPath -Name "ScreenSaverIsSecure" -Value "0" -Force
              }
              [gc]::Collect()
              reg unload "HKU\TEMPUSER" 2>$null | Out-Null
          }

      - name: Install Virtual Display Driver
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference    = 'SilentlyContinue'

          $driverZip = "$env:TEMP\usbmmidd.zip"
          $driverDir = "C:\VirtualDisplay"
          New-Item -ItemType Directory -Path $driverDir -Force | Out-Null
          Remove-Item $driverZip -Force -ErrorAction SilentlyContinue

          $urls = @(
              "https://www.amyuni.com/downloads/usbmmidd_v2.zip",
              "https://www.amyuni.com/downloads/usbmmidd.zip",
              "https://github.com/itsmikethetech/Virtual-Display-Driver/releases/latest/download/usbmmidd_v2.zip"
          )

          $downloaded = $false
          foreach ($url in $urls) {
              try {
                  Write-Host "Trying $url ..."
                  [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                  Invoke-WebRequest -Uri $url -OutFile $driverZip -TimeoutSec 45 -UseBasicParsing
                  if ((Test-Path $driverZip) -and (Get-Item $driverZip).Length -gt 100000) {
                      $downloaded = $true
                      Write-Host "Downloaded from $url ($((Get-Item $driverZip).Length) bytes)"
                      break
                  }
              } catch {
                  Write-Warning "Failed $url : $($_.Exception.Message)"
              }
          }

          if (-not $downloaded) {
              Write-Warning "Virtual display driver unavailable — RDP session will still provide a display. Skipping."
              exit 0
          }

          try {
              Expand-Archive -Path $driverZip -DestinationPath $driverDir -Force -ErrorAction Stop
          } catch {
              Write-Warning "Extraction failed: $($_.Exception.Message) — skipping."
              exit 0
          }

          $installer = Get-ChildItem -Path $driverDir -Recurse -Filter "deviceinstaller64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
              Write-Warning "deviceinstaller64.exe not found in archive — skipping."
              exit 0
          }

          Set-Location $installer.DirectoryName

          & .\deviceinstaller64.exe install usbmmidd.inf usbmmidd 2>&1 | Out-Host
          $rc1 = $LASTEXITCODE
          & .\deviceinstaller64.exe enableidd 1 2>&1 | Out-Host
          $rc2 = $LASTEXITCODE

          if ($rc1 -eq 0 -and $rc2 -eq 0) {
              Write-Host "Virtual Display Driver installed and enabled."
          } else {
              Write-Warning "Driver install returned codes install=$rc1 enable=$rc2 (non-fatal)."
          }

          Start-Sleep -Seconds 3

      - name: Install Software
        run: |
          winget source update
          winget install --id OBSProject.OBSStudio   --exact --source winget --accept-source-agreements --accept-package-agreements
          winget install --id Zoom.Zoom              -e      --source winget --accept-source-agreements --accept-package-agreements
          winget install --id AutoHotkey.AutoHotkey  --exact --source winget --accept-source-agreements --accept-package-agreements

          python -m pip install --upgrade pip
          pip install requests requests-toolbelt

      - name: Download & Configure OBS Scenes & Profiles
        shell: pwsh
        env:
          OBS_JSON_URL: ${{ secrets.OBS_JSON_URL }}
          CORE_TIME:     ${{ secrets.CORE_TIME }}
        run: |
          $ErrorActionPreference = 'Continue'
          $rdpUser = "Cloud PC"
          $url = if (-not [string]::IsNullOrWhiteSpace($env:OBS_JSON_URL)) { $env:OBS_JSON_URL } else { "***" }

          Write-Host "Fetching OBS configuration from: $url"
          $data = (Invoke-WebRequest -Uri $url).Content | ConvertFrom-Json

          $stageRoot    = "C:\Cloud\obs-stage"
          $stageScenes  = Join-Path $stageRoot "scenes"
          $stageProfile = Join-Path $stageRoot "profile"

          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue }
          New-Item -ItemType Directory -Force -Path $stageScenes  | Out-Null
          New-Item -ItemType Directory -Force -Path $stageProfile | Out-Null

          foreach ($fileUrl in $data.scenes) {
              $fileName = Split-Path ([uri]$fileUrl).AbsolutePath -Leaf
              Write-Host "Staging scene:   $fileName"
              Invoke-WebRequest -Uri $fileUrl -OutFile (Join-Path -Path $stageScenes -ChildPath $fileName)
          }

          foreach ($fileUrl in $data.profiles) {
              $fileName = Split-Path ([uri]$fileUrl).AbsolutePath -Leaf
              Write-Host "Staging profile: $fileName"
              Invoke-WebRequest -Uri $fileUrl -OutFile (Join-Path -Path $stageProfile -ChildPath $fileName)
          }

          $moverScript = @'
          $ErrorActionPreference = 'Continue'

          $stageRoot    = "C:\Cloud\obs-stage"
          $stageScenes  = Join-Path $stageRoot "scenes"
          $stageProfile = Join-Path $stageRoot "profile"
          
          $apps = @(
              @{
                  Name = "OBS Studio"
                  Id   = "OBSProject.OBSStudio"
              },
              @{
                  Name = "Zoom"
                  Id   = "Zoom.Zoom"
              },
              @{
                  Name = "AutoHotkey"
                  Id   = "AutoHotkey.AutoHotkey"
              }
          )
          
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
              Write-Host "ERROR: winget is not available." -ForegroundColor Red
              exit 1
          }
          
          foreach ($app in $apps) {
          
              Write-Host "Checking $($app.Name)..." -ForegroundColor Cyan
          
              $installed = winget list `
                  --id $app.Id `
                  --exact `
                  --source winget `
                  --accept-source-agreements `
                  2>$null
          
              if ($LASTEXITCODE -eq 0 -and $installed -match [regex]::Escape($app.Id)) {
                  Write-Host "$($app.Name) is already installed." -ForegroundColor Green
              }
              else {
                  Write-Host "Installing $($app.Name)..." -ForegroundColor Yellow
          
                  winget install `
                      --id $app.Id `
                      --exact `
                      --source winget `
                      --accept-source-agreements `
                      --accept-package-agreements
          
                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "$($app.Name) installed successfully." -ForegroundColor Green
                  }
                  else {
                      Write-Host "Failed to install $($app.Name)." -ForegroundColor Red
                  }
              }
          }
          
          $candidates = @(
              $env:USERPROFILE
              "C:\Users\Cloud PC.runnervmvmocb"
              "C:\Users\Cloud PC"
          ) | Where-Object {
              $_ -and (Test-Path $_)
          } | Select-Object -Unique
          
          if (-not $candidates) {
              Write-Host "No user profile found." -ForegroundColor Yellow
              exit 0
          }
          
          $profilePath = $candidates | Select-Object -First 1
          
          $destScenes = Join-Path $profilePath "AppData\Roaming\obs-studio\basic\scenes"
          $destProfile = Join-Path $profilePath "AppData\Roaming\obs-studio\basic\profiles\Untitled"
          
          if (-not (Test-Path $destScenes)) {
              New-Item -ItemType Directory -Path $destScenes -Force | Out-Null
          }
          
          if (-not (Test-Path $destProfile)) {
              New-Item -ItemType Directory -Path $destProfile -Force | Out-Null
          }
          
          if (Test-Path $stageScenes) {
              Get-ChildItem -Path $stageScenes -File -ErrorAction SilentlyContinue | ForEach-Object {
                  Move-Item `
                      -Path $_.FullName `
                      -Destination (Join-Path $destScenes $_.Name) `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }
          
          if (Test-Path $stageProfile) {
              Get-ChildItem -Path $stageProfile -File -ErrorAction SilentlyContinue | ForEach-Object {
                  Move-Item `
                      -Path $_.FullName `
                      -Destination (Join-Path $destProfile $_.Name) `
                      -Force `
                      -ErrorAction SilentlyContinue
              }
          }
          
          New-Item -Path "HKCU:\SOFTWARE\Policies\Zoom\Zoom Meetings\Meetings" -Force | Out-Null
          New-ItemProperty `
              -Path "HKCU:\SOFTWARE\Policies\Zoom\Zoom Meetings\Meetings" `
              -Name "EnterFullScreenWhenJoinMeeting" `
              -PropertyType DWord `
              -Value 1 `
              -Force | Out-Null
          
          Write-Host "Zoom full-screen-on-join policy configured." -ForegroundColor Green
          Write-Host "Completed." -ForegroundColor Green
          '@

          $moverPath = "C:\Cloud\obs-mover.ps1"
          New-Item -ItemType Directory -Path "C:\Cloud" -Force | Out-Null
          $moverScript | Out-File -FilePath $moverPath -Encoding utf8 -Force
          
          $currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $windowsPrincipal = New-Object Security.Principal.WindowsPrincipal($currentIdentity)
          
          if (-not $windowsPrincipal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
              Start-Process powershell.exe -Verb RunAs -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$PSCommandPath`""
              exit
          }
          
          & "$env:SystemRoot\System32\schtasks.exe" /delete /tn "OBSMover" /f 2>$null | Out-Null
          $global:LASTEXITCODE = 0
          
          $action = New-ScheduledTaskAction -Execute "powershell.exe" `
              -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$moverPath`"" `
              -WorkingDirectory "C:\Cloud"
          
          $trigger = New-ScheduledTaskTrigger -Daily -At $env:CORE_TIME
          
          $principal = New-ScheduledTaskPrincipal `
              -UserId $rdpUser `
              -LogonType Interactive `
              -RunLevel Highest
          
          $settings = New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -StartWhenAvailable `
              -RestartCount 999 `
              -RestartInterval (New-TimeSpan -Minutes 1) `
              -ExecutionTimeLimit (New-TimeSpan -Hours 0)
          
          Register-ScheduledTask `
              -TaskName "OBSMover" `
              -Action $action `
              -Trigger $trigger `
              -Principal $principal `
              -Settings $settings `
              -Force | Out-Null
          
          Write-Host "Successfully registered OBSMover task at $env:CORE_TIME (daily)."
          
          $task = Get-ScheduledTask -TaskName "OBSMover" -ErrorAction SilentlyContinue
          
          if ($task) {
              Write-Host "  Name     : $($task.TaskName)"
              Write-Host "  State    : $($task.State)"
              Write-Host "  Principal: $($task.Principal.UserId) ($($task.Principal.LogonType))"
              Write-Host "  RunLevel : $($task.Principal.RunLevel)"
              $task.Triggers | ForEach-Object {
                  Write-Host "  Trigger  : $($_.CimClass.CimClassName) @ $($_.StartBoundary)"
              }
          } else {
              Write-Host "::error::Task 'OBSMover' was NOT registered."
              exit 1
          }
          
          Write-Host "OBS config staged at: $stageRoot"
          Write-Host "OBSMover will move files daily at $env:CORE_TIME."
          
          $global:LASTEXITCODE = 0
          exit 0
          
      - name: Configure Cloud Directory & Auto Tasks
        env:
          LOGIN_URL:    ${{ secrets.LOGIN_URL }}
          LOGIN_TIME:   ${{ secrets.LOGIN_TIME }}
          OBS_URL:      ${{ secrets.OBS_URL }}
          CORE_TIME:     ${{ secrets.CORE_TIME }}
          AHK_URL:      ${{ secrets.AHK_URL }}
          AHK_TIME:     ${{ secrets.AHK_TIME }}
          UPLOAD_URL:   ${{ secrets.UPLOAD_URL }}
          UPLOAD_TIME:  ${{ secrets.UPLOAD_TIME }}
          OBS_REC_TIME: ${{ secrets.OBS_REC_TIME }}
        run: |
          New-Item -ItemType Directory -Path "C:\Cloud" -Force | Out-Null
          $rdpUser = "Cloud PC"

          $settings = New-ScheduledTaskSettingsSet `
              -AllowStartIfOnBatteries `
              -DontStopIfGoingOnBatteries `
              -StartWhenAvailable `
              -RestartCount 999 `
              -RestartInterval (New-TimeSpan -Minutes 1) `
              -ExecutionTimeLimit (New-TimeSpan -Hours 0)
          
          # --- 1. Login Task (daily only, no at-logon trigger) ---
          if (-not [string]::IsNullOrWhiteSpace($env:LOGIN_URL) -and -not [string]::IsNullOrWhiteSpace($env:LOGIN_TIME)) {
              $loginFile = "login.ahk"
              $loginDest = "C:\Cloud\$loginFile"
              $loginName = "LoginTask"
          
              Write-Host "Downloading Login Script: $env:LOGIN_URL -> $loginDest"
              try {
                  Invoke-WebRequest -Uri $env:LOGIN_URL -OutFile $loginDest
                  $action    = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c start `"`" `"$loginDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger   = New-ScheduledTaskTrigger -Daily -At $env:LOGIN_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $loginName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered Login Task '$loginName' ($loginDest) at $env:LOGIN_TIME"
              } catch {
                  Write-Warning "Failed setting up Login Task: $($_.Exception.Message)"
              }
          }
          
          # --- 2. AHK Task (daily only, no at-logon trigger) ---
          if (-not [string]::IsNullOrWhiteSpace($env:AHK_URL) -and -not [string]::IsNullOrWhiteSpace($env:AHK_TIME)) {
              $ahkFile = "auto.ahk"
              $ahkDest = "C:\Cloud\$ahkFile"
              $ahkName = "AHKTask"

              Write-Host "Downloading AHK Script: $env:AHK_URL -> $ahkDest"
              try {
                  Invoke-WebRequest -Uri $env:AHK_URL -OutFile $ahkDest
                  $action    = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c start `"`" `"$ahkDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger   = New-ScheduledTaskTrigger -Daily -At $env:AHK_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $ahkName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered AHK Task '$ahkName' ($ahkDest) at $env:AHK_TIME"
              } catch {
                  Write-Warning "Failed setting up AHK Task: $($_.Exception.Message)"
              }
          }

          # --- 3. OBS_REC Task (daily: restart OBS and start recording) ---
          if (-not [string]::IsNullOrWhiteSpace($env:OBS_REC_TIME)) {
              $obsRecFile = "obs_rec.ps1"
              $obsRecDest = "C:\Cloud\$obsRecFile"
              $obsRecName = "OBS_REC"

              $obsRecScript = @(
                  'Stop-Process -Name "obs64" -ErrorAction SilentlyContinue'
                  'Start-Sleep -Seconds 3'
                  'Start-Process "C:\Program Files\obs-studio\bin\64bit\obs64.exe" -WorkingDirectory "C:\Program Files\obs-studio\bin\64bit" -ArgumentList "--collection", "Zoom", "--startrecording"'
              ) -join "`r`n"

              Write-Host "Creating OBS_REC script: $obsRecDest"
              try {
                  Set-Content -Path $obsRecDest -Value $obsRecScript -Encoding UTF8

                  $action    = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$obsRecDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger   = New-ScheduledTaskTrigger -Daily -At $env:OBS_REC_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $obsRecName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered OBS_REC Task '$obsRecName' at $env:OBS_REC_TIME"
              } catch {
                  Write-Warning "Failed setting up OBS_REC Task: $($_.Exception.Message)"
              }
          }

          # --- 4. UPLOAD Task (daily only, no at-logon trigger) ---
          if (-not [string]::IsNullOrWhiteSpace($env:UPLOAD_URL) -and -not [string]::IsNullOrWhiteSpace($env:UPLOAD_TIME)) {
              $uploadFile = "upload.py"
              $uploadDest = "C:\Cloud\$uploadFile"
              $uploadName = "UploadTask"
          
              Write-Host "Downloading Upload Script: $env:UPLOAD_URL -> $uploadDest"
              try {
                  Invoke-WebRequest -Uri $env:UPLOAD_URL -OutFile $uploadDest
                  $action    = New-ScheduledTaskAction -Execute "python" -Argument "`"$uploadDest`"" -WorkingDirectory "C:\Cloud"
                  $trigger   = New-ScheduledTaskTrigger -Daily -At $env:UPLOAD_TIME
                  $principal = New-ScheduledTaskPrincipal -UserId $rdpUser -LogonType Interactive -RunLevel Highest
                  Register-ScheduledTask -TaskName $uploadName -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force
                  Write-Host "Successfully registered Upload Task '$uploadName' at $env:UPLOAD_TIME"
              } catch {
                  Write-Warning "Failed setting up Upload Task: $($_.Exception.Message)"
              }
          }

      - name: Configure Direct Console Auto-Loop
        run: |
          $scriptContent = @'
          while ($true) {
              try {
                  $sessions = qwinsta 2>$null
                  $hasConsoleActive = $false

                  foreach ($line in $sessions) {
                      if ($line -match "^\s*\S+\s+(\d+)\s+Disc") {
                          $sid = $matches[1]
                          if ($sid -ne "0") {
                              cmd.exe /c "tscon $sid /dest:console" 2>$null
                          }
                      }
                      if ($line -match "^\s*console\s+(\d+)\s+Active") {
                          $hasConsoleActive = $true
                      }
                  }

                  if (-not $hasConsoleActive) {
                      Add-Content -Path "C:\Cloud\keepalive.log" -Value "[$(Get-Date)] No active console — rebooting"
                      cmd.exe /c "shutdown /r /t 0 /f" 2>$null
                      Start-Sleep -Seconds 120
                  }

                  foreach ($svc in @("AudioSrv","AudioEndpointBuilder")) {
                      $s = Get-Service -Name $svc -ErrorAction SilentlyContinue
                      if ($s -and $s.Status -ne "Running") {
                          Start-Service -Name $svc -ErrorAction SilentlyContinue
                      }
                  }
              } catch {
                  Add-Content -Path "C:\Cloud\keepalive.log" -Value "[$(Get-Date)] EX: $_"
              }
              Start-Sleep -Seconds 5
          }
          '@

          $scriptPath = "C:\KeepScreenAlive.ps1"
          New-Item -ItemType Directory -Path "C:\Cloud" -Force | Out-Null
          $scriptContent | Out-File -FilePath $scriptPath -Encoding utf8

          $action    = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File $scriptPath"
          $trigger   = New-ScheduledTaskTrigger -AtStartup
          $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest

          Register-ScheduledTask -TaskName "KeepScreenAliveTask" -Action $action -Trigger $trigger -Principal $principal -Force
          Start-ScheduledTask -TaskName "KeepScreenAliveTask"

      - name: Install & Connect Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          curl.exe -sSL "$tsUrl" -o "$installerPath"

          $process = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/qn", "/norestart" -Wait -PassThru
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

          $timeout = 0
          while (-not (Test-Path $tsExe) -and $timeout -lt 30) {
              Start-Sleep -Seconds 2
              $timeout += 2
          }

          if (-not (Test-Path $tsExe)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue | Start-Service -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          & "$tsExe" up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID" --unattended

          $tsIP = ""
          for ($i = 1; $i -le 15; $i++) {
              $tsIP = (& "$tsExe" ip -4 2>$null).Trim()
              if ($tsIP -and $tsIP -match "^\d+\.\d+\.\d+\.\d+$") { break }
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP assignment timed out."
              exit 1
          }

          Write-Host "Tailscale IP assigned successfully: $tsIP"
          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Send Credentials to Cloudflare Worker
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          $payload = @{
              address  = "$env:TAILSCALE_IP"
              username = "Cloud PC"
              password = "123456"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "$env:CF_WORKER_URL/webhook" -Method Post -Body $payload -ContentType "application/json"

      - name: Maintain Active Runner Loop & Trigger RDP Bridge
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $rdpUser = "Cloud PC"
          $rdpPass = "123456"

          Write-Host "`n======================================================="
          Write-Host "RDP ACCESS READY"
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $rdpUser"
          Write-Host "Password : [PROTECTED]"
          Write-Host "=======================================================`n"

          $headers = @{
              "Accept"               = "application/vnd.github+json"
              "Authorization"        = "Bearer $env:GH_PAT"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $body = @{
              event_type     = "RDP"
              client_payload = @{
                  ip       = "$env:TAILSCALE_IP"
                  username = "$rdpUser"
                  password = "$rdpPass"
              }
          } | ConvertTo-Json -Compress

          Write-Host "Triggering Linux RDP Bridge workflow (bridge.yml)..."
          try {
              $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/dispatches"
              Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body -ContentType "application/json"
              Write-Host "Successfully dispatched repository_dispatch event to bridge.yml"
          } catch {
              Write-Warning "Failed to trigger dispatch event: $($_.Exception.Message)"
          }

          $totalSeconds   = 9000
          $elapsedSeconds = 0
          $heartbeatPath  = "C:\Cloud\login.heartbeat"

          while ($elapsedSeconds -lt $totalSeconds) {
              try {
                  if (Test-Path $heartbeatPath) {
                      $age = (Get-Date) - (Get-Item $heartbeatPath).LastWriteTime
                      if ($age.TotalMinutes -gt 10) {
                          Write-Host "[$(Get-Date)] login.py stalled ($([int]$age.TotalMinutes) min) — restarting LoginTask"
                          Restart-ScheduledTask -TaskName "LoginTask" -ErrorAction SilentlyContinue
                          (Get-Date).ToString() | Out-File -FilePath $heartbeatPath -Encoding utf8
                      }
                  }
              } catch {
                  Write-Warning "Watchdog error: $($_.Exception.Message)"
              }

              Write-Host "[$(Get-Date)] RDP & Virtual Engine Active ($elapsedSeconds / $totalSeconds seconds)..."
              Start-Sleep -Seconds 300
              $elapsedSeconds += 300
          }

          Write-Host "Completing workflow successfully."
          exit 0

      - name: Clear Cloudflare Worker
        if: always()
        env:
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
        run: |
          Write-Host "Clearing stored RDP address from Cloudflare Worker..."
          try {
              $body = @{ reason = "workflow-stopped" } | ConvertTo-Json
              Invoke-RestMethod -Uri "$env:CF_WORKER_URL/clear" -Method Post -Body $body -ContentType "application/json"
              Write-Host "Successfully cleared stored RDP data."
          } catch {
              Write-Warning "Failed to clear KV: $($_.Exception.Message)"
          }
